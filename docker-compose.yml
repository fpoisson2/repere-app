services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    env_file: .env
    ports:
      - "${APP_PORT:-8080}:8000"
    volumes:
      - alcohol_data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  alcohol_data:

