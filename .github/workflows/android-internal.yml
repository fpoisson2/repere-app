name: Android — test interne Play

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-play-internal-dev
  cancel-in-progress: false

jobs:
  test-build-publish:
    name: Tester, signer et publier
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: play-internal
    defaults:
      run:
        working-directory: android

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer JetBrains Runtime 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Calculer les versions dev
        id: version
        shell: bash
        run: |
          sequence=$((GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          mobile_code=$((37000000 + sequence))
          wear_code=$((36000000 + sequence))
          release_version="$(date -u +%Y.%m).beta-${sequence}"
          if (( mobile_code > 2100000000 || wear_code >= mobile_code )); then
            echo "Numéro de version Android invalide" >&2
            exit 1
          fi
          echo "mobile_code=$mobile_code" >> "$GITHUB_OUTPUT"
          echo "wear_code=$wear_code" >> "$GITHUB_OUTPUT"
          echo "mobile_name=$release_version" >> "$GITHUB_OUTPUT"
          echo "wear_name=$release_version" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_version" >> "$GITHUB_OUTPUT"

      - name: Restaurer la clé de signature
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > ci-upload.jks
          {
            echo "storeFile=ci-upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          test -s ci-upload.jks

      - name: Tester et construire les versions release
        shell: bash
        run: |
          ./gradlew \
            -PMOBILE_VERSION_CODE=${{ steps.version.outputs.mobile_code }} \
            -PMOBILE_VERSION_NAME=${{ steps.version.outputs.mobile_name }} \
            -PWEAR_VERSION_CODE=${{ steps.version.outputs.wear_code }} \
            -PWEAR_VERSION_NAME=${{ steps.version.outputs.wear_name }} \
            :core:test :data:test :mobile:testDebugUnitTest \
            :mobile:assembleRelease :mobile:bundleRelease \
            :wear:assembleRelease :wear:bundleRelease

      - name: Conserver les artefacts du build
        uses: actions/upload-artifact@v7
        with:
          name: repere-${{ steps.version.outputs.release_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            android/mobile/build/outputs/apk/release/mobile-release.apk
            android/mobile/build/outputs/bundle/release/mobile-release.aab
            android/mobile/build/outputs/mapping/release/mapping.txt
            android/wear/build/outputs/apk/release/wear-release.apk
            android/wear/build/outputs/bundle/release/wear-release.aab
            android/wear/build/outputs/mapping/release/mapping.txt

      - name: Vérifier les versions mobile et Wear
        shell: bash
        run: |
          jq -e --arg name "${{ steps.version.outputs.mobile_name }}" --argjson code "${{ steps.version.outputs.mobile_code }}" \
            '.elements[0].versionName == $name and .elements[0].versionCode == $code' \
            mobile/build/outputs/apk/release/output-metadata.json
          jq -e --arg name "${{ steps.version.outputs.wear_name }}" --argjson code "${{ steps.version.outputs.wear_code }}" \
            '.elements[0].versionName == $name and .elements[0].versionCode == $code' \
            wear/build/outputs/apk/release/output-metadata.json
          test "${{ steps.version.outputs.mobile_name }}" = "${{ steps.version.outputs.wear_name }}"

      - name: Publier le mobile sur la piste de test interne
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ca.repere.app
          releaseFiles: android/mobile/build/outputs/bundle/release/mobile-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ steps.version.outputs.release_name }}
          whatsNewDirectory: android/distribution/whatsnew

      - name: Publier Wear OS sur sa piste de test interne
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ca.repere.app
          releaseFiles: android/wear/build/outputs/bundle/release/wear-release.aab
          tracks: wear:qa
          status: completed
          releaseName: ${{ steps.version.outputs.release_name }}
          whatsNewDirectory: android/distribution/whatsnew

      - name: Nettoyer les fichiers sensibles
        if: always()
        shell: bash
        run: rm -f ci-upload.jks keystore.properties
